version: "1"

databases:
  - name: bank-1v-db
    databaseName: bank_1v
    user: bank_user
    region: ohio
    plan: free

services:
  - type: web
    name: bank-1v
    runtime: node
    region: ohio
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bank-1v-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_PASSWORD
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
